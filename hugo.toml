baseURL = 'https://dai08srhg.github.io/portfolio/'
title = "D. Fukushima"
languageCode = "ja"
defaultContentLanguage = "ja"
enableRobotsTXT = true

# レイアウトは layouts/ 以下に自前で持っているため、テーマは使用していない。
# プロフィール・経歴・論文などの内容は data/*.yaml を編集する。

[params]
  description = "ML Engineer / Data Scientist 福島大祐のポートフォリオ"

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Profile"
    url = "/"
    weight = 1

  [[menu.main]]
    identifier = "tech"
    name = "Tech"
    url = "/tech/"
    weight = 2

  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 3

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # content/tech 以下で iframe などの生 HTML を使っているため必要
      unsafe = true

[taxonomies]
  # 分類は使っていないので空にして /tags/ や /categories/ を生成しない
