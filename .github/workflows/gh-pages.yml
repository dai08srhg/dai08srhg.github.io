name: github pages

on:
  push:
    branches:
      - master # Set a branch to deploy
  workflow_dispatch: # Actions タブから手動実行も可能

# gh-pages ブランチへ push するために書き込み権限が必要
permissions:
  contents: write

# 連続 push したときに古いデプロイが後から上書きしないようにする
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # ローカル開発環境と揃えること（README 参照）
          hugo-version: "0.169.0"

      - name: Build
        run: hugo --gc --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
