{{- $profile := hugo.Data.profile -}}
<footer class="site-footer">
	<div class="wrap site-footer__inner">
		<p class="site-footer__copyright">&copy; {{ now.Format "2006" }} {{ $profile.name_en }}</p>
		<ul class="site-footer__links">
			{{- range $profile.links }}
			<li><a href="{{ .url }}" rel="me noopener noreferrer" target="_blank">{{ .name }}</a></li>
			{{- end }}
		</ul>
	</div>
</footer>
